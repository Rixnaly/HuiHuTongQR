name: Build HuiHuTong Mod APK

# 手动触发：Actions 页面 → 左侧选这个 workflow → Run workflow → 选分支 → 绿色按钮
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 33 + build-tools 33
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-33" "build-tools;33.0.1"

      - name: Build release APK (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huihutong-mod-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
