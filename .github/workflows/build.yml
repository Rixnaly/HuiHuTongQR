name: Build HuiHuTong Mod APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它在 2026 的 runner 上（Node 24 强制迁移）会失败。
      # 直接用 runner 镜像里预装的 Android SDK。
      - name: Prepare Android SDK (preinstalled)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK" || true
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          echo "using: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-33" "build-tools;33.0.1"
          echo "sdk.dir=$SDK" > local.properties

      - name: Build release APK (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huihutong-mod-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
